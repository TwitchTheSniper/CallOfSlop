<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

  const p = new Float32Array(idx.length * 9), n = new Float32Array(idx.length * 9), c = new Float32Array(idx.length * 9);

    const col = g.attributes.color.array;
    g.userData.tris.forEach((t, k) => {
      const L = M.looks[look16[t]];

      else if (byFinish) tmp.copy(finishColour(L[3] || "none"));
      else { tmp.set(L[0]); if (L[2]) tmp.multiplyScalar(1.6); }

const views = { iso: [-1, 0.7, -1.1], side: [-1, 0.05, 0], top: [0.001, 1, 0.0001], front: [0, 0.15, -1] }; // (the game's bow is -z, port is -x)

// Cutaway: everything above the slider's height is clipped, to look into decks.

const sideCut = (input, out, plane, a) => () => { if (!M) return; const f = input.value / 1000, v = M.min[a] + f * size[a]; plane.constant = f >= 1 ? 1e6 : v; out.textContent = f >= 1 ? "off" : (v - M.min[a]).toFixed(2) + " m"; };
cutX.oninput = sideCut(cutX, cutXv, clipX, 0); cutZ.oninput = sideCut(cutZ, cutZv, clipZ, 2);
function resetCuts() { cutX.value = cutZ.value = 1000; cutX.oninput(); cutZ.oninput(); }
function makeEdges() { edges = edgeLines(solidGeo); scene.add(edges); for (const p of pieces) if (!p.edges) { p.edges = edgeLines(p.solid.geometry); p.group.add(p.edges); } }
const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); fn(on); }; };
toggle("tGlass", on => { glassOn = on; if (glass) glass.visible = on; for (const p of pieces) p.glass.visible = on; });
toggle("tEdges", on => { edgesOn = on; if (on && !edges && M) makeEdges(); if (edges) edges.visible = on; for (const p of pieces) if (p.edges) p.edges.visible = on; });
toggle("tFinish", on => { byFinish = on; paint(); });
toggle("tSpin", on => { controls.autoRotate = on; });
toggle("tLinks", on => { linksOn = on; if (on) makeLinks(); else dropLinks(); });
toggle("tXray", on => { xray = on; if (on && !linksOn) document.getElementById("tLinks").click(); else if (linksOn) makeLinks(); });

// Parts list: one row per distinct part name, with its count; a click picks the first of them.
const list = document.getElementById("parts"), search = document.getElementById("search");
let names = new Map();
function fillList() {
  const q = search.value.trim().toLowerCase(); list.innerHTML = "";
  for (const [n, ids] of names) if (!q || n.toLowerCase().includes(q)) {
    const li = document.createElement("li"); li.innerHTML = `<span></span><em>${ids.length > 1 ? "x" + ids.length : "#" + ids[0]}</em>`; li.firstChild.textContent = n;
    li.classList.toggle("on", ids.includes(picked)); li.onclick = () => { const i = ids.includes(picked) ? ids[(ids.indexOf(picked) + 1) % ids.length] : ids[0]; pick(i); focus(i); }; list.appendChild(li);
  }
}
search.oninput = fillList;
// Centre the view on part i where it is now (a moving part at its current pose), keeping the way the camera looks.
function focus(i) {
  if (!M || !partBox[i] || partBox[i].isEmpty()) return;
  const b = partBox[i].clone(), k = partMove[i];
  if (k && pieces[k - 1]) { pieces[k - 1].group.updateMatrixWorld(); b.applyMatrix4(pieces[k - 1].group.matrixWorld); }
  const c = b.getCenter(new THREE.Vector3()), r = Math.max(0.3, b.getSize(new THREE.Vector3()).length() / 2);
  const d = camera.position.clone().sub(controls.target); if (d.lengthSq() < 1e-9) d.set(-1, 0.7, -1.1);
  controls.target.copy(c); camera.position.copy(c).add(d.normalize().multiplyScalar(r * 3.2)); controls.update();
}
function pick(i) {
  picked = i; paint(); fillList();
  const el = document.getElementById("picked"); el.hidden = !(M && i >= 0); if (!el.hidden) el.textContent = `Picked: ${M.parts[i][0]}  #${i}`;
}

// Hover and click: a ray against the solids (and glass), the triangle's part and look.
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById("tip");
function hit(ev) {
  if (!M) return null;
  const r = renderer.domElement.getBoundingClientRect(); mouse.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const objs = [solid, ...pieces.map(p => p.solid)]; if (glass.visible) objs.push(glass, ...pieces.map(p => p.glass));
  const h = ray.intersectObjects(objs, false).find(h => clips.every(c => c.distanceToPoint(h.point) >= 0));
  if (!h) return null; const t = h.object.geometry.userData.tris[h.faceIndex]; return { part: triPart[t], look: M.looks[look16[t]] };
}
let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
// A tap on a phone has no hover: the tap itself shows the part's name and look in the tip, and the panel names the pick.
function showTip(h, x, y) {
  const [n] = M.parts[h.part]; const L = h.look;
  tip.innerHTML = `<b></b><small></small>`; tip.firstChild.textContent = `${n}  #${h.part}`;
  tip.lastChild.textContent = `${L[0]}${L[3] ? " · " + L[3] : ""}${L[1] > 0 ? " · glass" : ""}${L[2] ? " · glow" : ""}`;
  tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - 220)) + "px"; tip.style.top = Math.min(y + 14, innerHeight - 60) + "px"; tip.hidden = false;
}
renderer.domElement.addEventListener("pointerup", e => {
  const touch = e.pointerType !== "mouse";
  if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < (touch ? 12 : 4)) {
    const h = hit(e); pick(h ? h.part : -1);
    if (touch) { if (h) showTip(h, e.clientX, e.clientY); else tip.hidden = true; }
  }
  down = null;
});
renderer.domElement.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  if (e.buttons) { tip.hidden = true; return; } const h = hit(e); if (!h) { tip.hidden = true; return; }
  showTip(h, e.clientX, e.clientY);
});
renderer.domElement.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") tip.hidden = true; });

// Animation: each track's pose (position and quaternion in the model frame) sampled evenly over the model's seconds; the slider scrubs,
// Play runs it (open, a pause, then shut again unless "Open and shut" is off; a loop just goes round), the marks jump to a step.
const animBox = document.getElementById("animBox"), playB = document.getElementById("play"), timeIn = document.getElementById("time"), timev = document.getElementById("timev"), marksEl = document.getElementById("marks");
let animT = 0, playing = false, dir = 1, holdUntil = 0, last = performance.now(), slow = false, back = true;
const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();
function pose(t) {
  if (!M || !M.anim) return;
  const S = M.anim.seconds || 1; animT = Math.max(0, Math.min(S, t));
  for (const p of pieces) {
    const n = p.frames.length - 1, x = n * animT / S, i = Math.min(n - 1, Math.floor(x)), u = x - i, a = p.frames[i], b = p.frames[i + 1] || a;
    p.group.position.set(a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u);
    qa.set(a[3], a[4], a[5], a[6]); qb.set(b[3], b[4], b[5], b[6]); p.group.quaternion.slerpQuaternions(qa, qb, u);
  }
  timeIn.value = Math.round(animT / S * 1000); timev.textContent = `${animT.toFixed(2)} / ${S.toFixed(1)} s`;
  marksEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.t <= animT + 1e-3 && !(+b.dataset.next <= animT + 1e-3)));
}
function setPlaying(on) { playing = on; playB.textContent = on ? "Pause" : "Play"; playB.setAttribute("aria-label", on ? "Pause" : "Play"); last = performance.now(); }
function setupAnim() {
  const a = M && M.anim; animBox.hidden = !a; setPlaying(false); dir = 1; holdUntil = 0; marksEl.innerHTML = "";
  if (!a) return;
  document.getElementById("tBack").hidden = !!a.loop;
  const ms = a.marks || [];
  ms.forEach(([t, label], i) => { const b = document.createElement("button"); b.textContent = label; b.dataset.t = t; b.dataset.next = i + 1 < ms.length ? ms[i + 1][0] : 1e9; b.onclick = () => { setPlaying(false); pose(t); }; marksEl.appendChild(b); });
  pose(0); if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setPlaying(true);
}
playB.onclick = () => { if (!playing && !M.anim.loop && dir > 0 && animT >= M.anim.seconds - 1e-3 && !back) pose(0); setPlaying(!playing); };
timeIn.oninput = () => { setPlaying(false); pose(timeIn.value / 1000 * (M.anim.seconds || 1)); };
toggle("tBack", on => { back = on; });
toggle("tSlow", on => { slow = on; });
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000) * (slow ? 0.25 : 1); last = now;
  if (!playing || !M || !M.anim) return;
  const S = M.anim.seconds || 1;
  if (now < holdUntil) return;
  let t = animT + dt * dir;
  if (M.anim.loop) t = t >= S ? t - S : t;
  else if (t >= S) { t = S; if (back) { dir = -1; holdUntil = now + 900; } else setPlaying(false); }
  else if (t <= 0) { t = 0; dir = 1; holdUntil = now + 900; }
  pose(t);
}
renderer.setAnimationLoop(now => { tick(now); controls.update(); renderer.render(scene, camera); });

// One model in the page, or a gallery: models/index.json lists the ships, the parts they use and parts in no ship. The first picker
// takes a ship (or the loose parts), the second the whole ship, one of its decks or one of its parts on its own.
// The address names the view: #ship, #ship--deck-2 or #ship--part-id (letters, digits and hyphens only).
const inline = JSON.parse(document.getElementById("model").textContent);
if (inline) show(inline);
else {
  const sel = document.getElementById("pick"), sel2 = document.getElementById("pick2"), cache = new Map();
  const say = text => { document.getElementById("name").textContent = text; };
  const opt = (parent, value, text) => { const o = document.createElement("option"); o.value = value; o.textContent = text; parent.appendChild(o); return o; };
  const group = (parent, label) => { const g = document.createElement("optgroup"); g.label = label; parent.appendChild(g); return g; };
  const load = async e => { if (!cache.has(e.file)) { say("Loading " + e.name + "..."); cache.set(e.file, await (await fetch(e.file)).json()); } return cache.get(e.file); };
  try {
    const idx = await (await fetch("models/index.json")).json();
    if (idx.groups) await shelves(idx);
    else {
    const partById = new Map(idx.parts.map(p => [p.id, p])), noun = idx.noun || "ship";
    sel.setAttribute("aria-label", "Choose a " + noun);
    for (const sh of idx.ships) opt(sel, sh.id, sh.name);
    if (idx.loose.length) opt(sel, "loose", "Parts in no " + noun);
    sel.hidden = sel2.hidden = false;
    let current = null; // (the first picker's value whose second list is filled)
    const fill = async top => {
      if (current === top) return; current = top; sel2.innerHTML = "";
      const ship = idx.ships.find(s => s.id === top);
      if (ship) {
        opt(sel2, top, "Whole " + noun);
        const m = await load(ship);
        if (m.decks && m.decks.length) { const g = group(sel2, "Decks"); m.decks.forEach((d, i) => opt(g, top + "--deck-" + (i + 1), "Deck " + d[0])); }
        const g = group(sel2, "Parts");
        for (const [id, n] of [...ship.uses].sort((a, b) => (partById.get(a[0])?.name || "").localeCompare(partById.get(b[0])?.name || "")))
          if (partById.has(id)) opt(g, top + "--part-" + id, partById.get(id).name + (n > 1 ? "  x" + n : ""));
      } else for (const id of idx.loose) if (partById.has(id)) opt(sel2, "loose--part-" + id, partById.get(id).name);
    };
    const open = async view => {
      let [top, rest] = view.split(/--(.*)/s); if (!idx.ships.some(s => s.id === top) && top !== "loose") { top = idx.ships[0] ? idx.ships[0].id : "loose"; rest = undefined; }
      sel.value = top; await fill(top);
      const want = rest ? top + "--" + rest : (top === "loose" ? sel2.options[0]?.value : top);
      if ([...sel2.options].some(o => o.value === want)) sel2.value = want;
      const v = sel2.value || want || "";
      const part = /--part-(.+)$/.exec(v), dk = /--deck-(\d+)$/.exec(v);
      if (part && partById.has(part[1])) show(await load(partById.get(part[1])));
      else { const ship = idx.ships.find(s => s.id === top); if (!ship) { say("No models yet"); return; } const m = await load(ship); if (M !== m) show(m); deck(dk ? +dk[1] - 1 : -1); }
    };
    sel.onchange = () => { location.hash = sel.value; };
    sel2.onchange = () => { location.hash = sel2.value; };
    addEventListener("hashchange", () => open(location.hash.slice(1)));
    await open(location.hash.slice(1));
    }
  } catch (err) { say("Could not load the gallery: " + err.message); }

  // The Animation gallery's index: shelves of items ({groups: [{name, items: [{id, name, file}]}]}); the first picker takes a shelf, the second an item; #id names it.
  async function shelves(idx) {
    const byId = new Map(); idx.groups.forEach(g => g.items.forEach(it => byId.set(it.id, [g.name, it])));
    sel.setAttribute("aria-label", "Choose a kind"); sel2.setAttribute("aria-label", "Choose an animation");
    idx.groups.forEach(g => opt(sel, g.name, `${g.name} (${g.items.length})`));
    sel.hidden = sel2.hidden = false;
    const fillShelf = name => { sel2.innerHTML = ""; for (const it of idx.groups.find(g => g.name === name).items) opt(sel2, it.id, it.name); };
    const open = async id => {
      const found = byId.get(id) || [idx.groups[0].name, idx.groups[0].items[0]];
      if (sel.value !== found[0] || !sel2.options.length) { sel.value = found[0]; fillShelf(found[0]); }
      sel2.value = found[1].id; const m = await load(found[1]); if (M !== m) show(m);
    };
    sel.onchange = () => { location.hash = idx.groups.find(g => g.name === sel.value).items[0].id; };
    sel2.onchange = () => { location.hash = sel2.value; };
    addEventListener("hashchange", () => open(location.hash.slice(1)));
    await open(location.hash.slice(1));
  }
}
</script>
