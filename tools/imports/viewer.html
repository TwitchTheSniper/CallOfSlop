<title>Imported ships</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a hangar bay. The ship fills the screen; one control rail on the left (a sheet at the bottom on a phone). */
:root {
  --bg: #e4e7ea; --sky: #d3d9de; --panel: #f6f7f8; --fg: #1d2329; --muted: #5d6873; --line: #c5ccd3;
  --accent: #c8641e; --accent-fg: #ffffff; --chip: #e9edf0; --pick: #ffb347;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif; --body: "Inter", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191d; --sky: #1c2227; --panel: #20262c; --fg: #e3e8ec; --muted: #94a0aa; --line: #343d45;
  --accent: #e07a30; --accent-fg: #15191d; --chip: #2a3138; --pick: #ffb347; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191d; --sky: #1c2227; --panel: #20262c; --fg: #e3e8ec; --muted: #94a0aa; --line: #343d45;
  --accent: #e07a30; --accent-fg: #15191d; --chip: #2a3138; --pick: #ffb347; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
.app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; min-width: 0; }
#view { position: relative; min-width: 0; min-height: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.45rem; margin: 0; text-wrap: balance; }
.eyebrow { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.desc { color: var(--muted); font-size: 0.85rem; line-height: 1.45; margin: 6px 0 0; }
select { width: 100%; font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { display: flex; flex-direction: column; gap: 2px; font-family: var(--mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.stats span { font-family: var(--body); font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
section { display: flex; flex-direction: column; gap: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
button { font: inherit; font-size: 0.82rem; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; text-align: left; }
button:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.ctl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; font-size: 0.85rem; }
.ctl button { min-width: 92px; text-align: center; }
.row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
.row input[type=range] { flex: 1; accent-color: var(--accent); }
.row output { font-family: var(--mono); font-size: 0.8rem; min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; }
.views { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.views button { background: var(--panel); padding: 5px 9px; font-size: 0.75rem; }
#picked { position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; max-width: calc(100% - 24px); }
#picked b { font-family: var(--display); font-weight: 600; }
#picked small { display: block; color: var(--muted); margin-top: 2px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 0.9rem; }
.note { font-size: 0.75rem; color: var(--muted); line-height: 1.4; margin: 0; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
  #view { grid-row: 1; } aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>

<div class="app">
  <aside>
    <div>
      <p class="eyebrow">Imported ships</p>
      <h1 id="name">Loading</h1>
      <p class="desc" id="desc"></p>
    </div>
    <select id="ship" aria-label="Ship" hidden></select>
    <div class="stats" id="stats"></div>
    <section aria-label="Show">
      <p class="eyebrow">Show</p>
      <div class="seg" id="modes">
        <button data-m="whole" class="on">Whole ship</button>
        <button data-m="cutaway">Cutaway</button>
        <button data-m="hull">Hull only</button>
        <button data-m="parts">Fittings only</button>
        <button data-m="exploded">Exploded</button>
        <button data-m="kit">Parts kit</button>
      </div>
    </section>
    <section aria-label="Moving parts" id="controls">
      <p class="eyebrow">Moving parts</p>
    </section>
    <section aria-label="Look">
      <p class="eyebrow">Look</p>
      <div class="ctl"><span>Canopy glass</span><button id="tGlass" class="on" aria-pressed="true">Shown</button></div>
      <div class="ctl"><span>Edges</span><button id="tEdges" aria-pressed="false">Off</button></div>
      <div class="row"><label for="cut">Cut at</label><input type="range" id="cut" min="0" max="1000" value="1000"><output id="cutv">off</output></div>
    </section>
    <p class="note">Built from the game's own part files and blueprint, so this is the ship as it is in game. Doors move by the game's door data. Drag to turn, scroll or pinch to zoom, and click a part to name it.</p>
  </aside>
  <div id="view">
    <div id="loading">Loading the ship</div>
    <div class="views">
      <button data-v="iso">Iso</button><button data-v="side">Side</button><button data-v="top">Top</button><button data-v="front">Bow</button><button data-v="back">Stern</button>
    </div>
    <div id="picked" hidden></div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";

const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true });

view.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdfe8f0, 0x3a3228, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2), fill = new THREE.DirectionalLight(0xffffff, 0.6); scene.add(sun, fill);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 1000);

function sky() { scene.background = new THREE.Color(css("--sky") || "#d3d9de"); }

new MutationObserver(sky).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let M = null, parts = [], grid = null, centre = new THREE.Vector3(), radius = 10, mode = "whole", glassOn = true, edgesOn = false, picked = -1, ctls = [];
const solidMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0.15, side: THREE.DoubleSide, clippingPlanes: clips });
const glassMat = new THREE.MeshStandardMaterial({ vertexColors: true, transparent: true, opacity: 0.35, roughness: 0.1, depthWrite: false, side: THREE.DoubleSide, clippingPlanes: clips });

// One mesh pair (solid, glass) a part, in the model's frame; a part on a door's track rides that track's pose.
function load(model) {

  M = model; parts = []; picked = -1; $("picked").hidden = true;
  const p16 = new Int16Array(b64(M.pos).buffer), n8 = new Int8Array(b64(M.nrm).buffer), look = new Uint16Array(b64(M.look).buffer);
  const track = M.track ? b64(M.track) : null, tmp = new THREE.Color();
  M.parts.forEach(([name, first, count], i) => {
    const outer = new THREE.Group(), pose = new THREE.Group(); outer.add(pose);
    for (const glassSide of [false, true]) {
      const idx = []; for (let t = first; t < first + count; t++) if ((M.looks[look[t]][1] > 0) === glassSide) idx.push(t);
      if (!idx.length) continue;
      const pos = new Float32Array(idx.length * 9), nrm = new Float32Array(idx.length * 9), col = new Float32Array(idx.length * 9);

    `<div><span>Mass t</span>${(M.mass / 1000).toFixed(1)}</div><div><span>Parts</span>${M.parts.length}</div><div><span>Doors</span>${M.anim ? M.anim.tracks.length : 0}</div>`;
  buildControls(); setEdges(edgesOn); setMode(mode, true); setView("iso"); $("loading").hidden = true;
}

// Each control (a ramp, the VTOL pods, the doors) moves its tracks between shut and open on its own.
function buildControls() {
  const box = $("controls"); box.querySelectorAll(".ctl").forEach(e => e.remove()); ctls = [];
  for (const c of M.controls || []) {
    const row = document.createElement("div"); row.className = "ctl";

    const b = document.createElement("button"); row.append(label, b); box.append(row);

}
const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();

    if (mode === "kit") { p.pose.position.set(0, 0, 0); p.pose.quaternion.identity(); continue; }
    const fr = M.anim.tracks[p.track - 1].frames, n = fr.length - 1, x = n * Math.min(1, (at.get(p.track) ?? 0) * S / S), i = Math.min(n - 1, Math.floor(x)), u = x - i, a = fr[i], b = fr[i + 1] || a;

// Where each part goes in each view: exploded pushes the fittings out and lifts the roof; the kit lays every part out by its model group.
let kit = new Map(), kitBox = new THREE.Box3();
function kitLayout() {
  kit = new Map();
  const groups = [...new Set(parts.map(p => p.group))].sort((a, b) => (a.startsWith("Hull") || a.includes("Hull Structure") ? 0 : 1) - (b.startsWith("Hull") || b.includes("Hull Structure") ? 0 : 1) || a.localeCompare(b));
  const gap = 0.6; let z = 0, x = 0, depth = 0;

  const rowW = Math.max(...sizes.map(v => v.x), Math.sqrt(sizes.reduce((t, v) => t + (v.x + gap) * (v.z + gap), 0)) * 1.25); // (about square)

    const ps = parts.filter(p => p.group === g).sort((a, b) => b.box.getSize(new THREE.Vector3()).x - a.box.getSize(new THREE.Vector3()).x);
    for (const p of ps) {
      const s = p.box.getSize(new THREE.Vector3());
      if (x > 0 && x + s.x > rowW) { z += depth + gap; x = 0; depth = 0; }
      kit.set(p, new THREE.Vector3(x + s.x / 2 - rowW / 2 - p.mid.x, -p.box.min.y, z + s.z / 2 - p.mid.z));

function placeOf(p) {

function shown(p) {

  if (mode === "hull") return p.kind !== "part";

function setMode(m, now) {

$("tEdges").onclick = () => setEdges(!edgesOn);
$("tGlass").onclick = () => { glassOn = !glassOn; glassMat.visible = glassOn; $("tGlass").textContent = glassOn ? "Shown" : "Hidden"; $("tGlass").classList.toggle("on", glassOn); $("tGlass").setAttribute("aria-pressed", String(glassOn)); };
$("cut").oninput = () => {
  const f = $("cut").value / 1000, y = M.min[1] + f * (M.max[1] - M.min[1]);

const views = { iso: [-1, 0.75, -1.1], side: [-1, 0.05, 0], top: [0.001, 1, 0.0001], front: [0, 0.15, -1], back: [0.2, 0.25, 1] }; // (the bow is -z)
let lastView = "iso";
function setView(v) {
  lastView = v;

function frame() { setView(lastView); }
document.querySelectorAll(".views button").forEach(b => b.onclick = () => setView(b.dataset.v));

// Picking: click a part to name it (and its model group); click empty space to clear.
const ray = new THREE.Raycaster(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {

  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const hits = ray.intersectObjects(parts.filter(p => p.outer.visible).map(p => p.outer), true).filter(h => h.object.isMesh && (glassOn || !h.object.userData.glass) && cutPlane.distanceToPoint(h.point) >= 0);

const pickMat = new THREE.MeshStandardMaterial({ color: 0xffb347, emissive: 0x6b3a00, roughness: 0.6, side: THREE.DoubleSide, clippingPlanes: clips });

let last = performance.now();
function tick(now) {

async function start() {
  try {
    const list = await (await fetch("models/index.json")).json();
    const sel = $("ship"); sel.hidden = list.length < 2;
    for (const s of list) { const o = document.createElement("option"); o.value = s.file; o.textContent = s.name; sel.append(o); }
    const pick = list.find(s => "#" + s.id === location.hash) || list[0];

start();
</script>
