<title>Ship Designer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a drafting console. Tool rail left, the 3D yard in the middle, the inspector and the checks right; stacks under the yard on a phone. */
:root {
  --bg: #e4e9ec; --panel: #f6f8f9; --ink: #18232b; --ink2: #56656f; --line: #c6d0d6; --chip: #e9eef1;
  --accent: #2f7fcf; --accent-ink: #ffffff; --ok: #2f8f4a; --warn: #b8780a; --bad: #c03a28;
  --yard: #1b2329; --yard-ink: #d6e0e6;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --panel: #172026; --ink: #dce5ea; --ink2: #93a3ad; --line: #2b3842; --chip: #1f2a31;
  --accent: #4b9be6; --accent-ink: #08121a; --ok: #5cc077; --warn: #e9a53b; --bad: #ec6a55;
  --yard: #11181d; --yard-ink: #d6e0e6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #172026; --ink: #dce5ea; --ink2: #93a3ad; --line: #2b3842; --chip: #1f2a31;
  --accent: #4b9be6; --accent-ink: #08121a; --ok: #5cc077; --warn: #e9a53b; --bad: #ec6a55;
  --yard: #11181d; --yard-ink: #d6e0e6; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); overflow: hidden; }
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.on, button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select, input[type=number], input[type=text] { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; min-width: 0; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font: 700 22px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.brand small { font: 500 11px var(--mono); letter-spacing: .1em; color: var(--ink2); margin-left: 8px; text-transform: none; }
.modes { display: flex; gap: 4px; }
.modes select { font: 600 15px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; width: 11em; }
.modes select.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.modes button { font: 600 15px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 14px; }
.grow { flex: 1; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.main { min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr) 300px; }
aside { background: var(--panel); overflow-y: auto; min-width: 0; padding: 14px 14px 24px; display: grid; gap: 16px; align-content: start; }
aside.left { border-right: 1px solid var(--line); }
aside.right { border-left: 1px solid var(--line); }
h2 { font: 600 17px/1.1 var(--display); letter-spacing: .06em; text-transform: uppercase; margin: 0; display: flex; align-items: baseline; gap: 8px; }
h2 .n { font: 500 11px var(--mono); color: var(--ink2); letter-spacing: .04em; text-transform: none; }
.sec { display: grid; gap: 8px; }
button.reset { padding: 1px 6px; font-size: 12px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row label { display: flex; gap: 6px; align-items: center; }
.grid2 { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; }
.grid2 > span { font: 12px var(--mono); color: var(--ink2); }
.hint { font-size: 12.5px; color: var(--ink2); }
.mono { font-family: var(--mono); font-size: 12px; }
.yard { position: relative; background: var(--yard); min-width: 0; min-height: 0; touch-action: none; }
.yard canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud button { background: rgba(20, 28, 34, .82); color: var(--yard-ink); border-color: #34444f; font-size: 12.5px; padding: 4px 9px; }
.hud button.on { background: var(--accent); color: var(--accent-ink); }
.tip { position: absolute; left: 10px; bottom: 10px; right: 10px; color: var(--yard-ink); font: 12px var(--mono); opacity: .8; pointer-events: none; }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #26323a; color: #f2f5f7; border-left: 3px solid var(--bad);
  padding: 7px 12px; font-size: 13px; border-radius: 3px; max-width: min(90%, 520px); pointer-events: none; }
.toast.info { border-left-color: var(--accent); }
.pal { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pal button { text-align: left; padding: 6px 8px; display: grid; gap: 1px; touch-action: none; user-select: none; }
.pal button b { font-weight: 600; font-size: 13px; }
.pal button i { font-style: normal; font-size: 11px; color: var(--ink2); font-family: var(--mono); }
.pal button.sock { border-left: 3px solid var(--warn); }
.kinds { display: flex; flex-wrap: wrap; gap: 5px; }
.kinds button { display: flex; gap: 6px; align-items: center; font-size: 12.5px; padding: 3px 8px; }
.sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.issues li { display: grid; grid-template-columns: 8px 1fr; gap: 8px; font-size: 12.5px; cursor: pointer; align-items: start; }
.issues li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--warn); }
.issues li.error::before { background: var(--bad); }
.issues li.good { cursor: default; } .issues li.good::before { background: var(--ok); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--chip); border-radius: 4px; padding: 6px 8px; }
.stat b { display: block; font: 600 20px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font: 11px var(--mono); color: var(--ink2); }
svg.prof { width: 100%; height: auto; background: var(--yard); border-radius: 4px; touch-action: none; }
svg.prof .pt { cursor: grab; }
.row input[type=number] { width: 74px; }
.gal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; max-height: 300px; overflow-y: auto; padding-right: 2px; }
.gal button { display: grid; gap: 2px; justify-items: center; padding: 4px 2px; font-size: 11px; line-height: 1.2; color: var(--ink); }
.gal button svg { width: 100%; max-width: 64px; height: auto; color: var(--accent); }
.gal button.on { background: var(--chip); color: var(--ink); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; width: min(720px, 94vw); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog textarea { width: 100%; height: 50vh; font: 12px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
.boot { position: absolute; inset: 0; display: grid; place-items: center; color: var(--yard-ink); font: 13px var(--mono); }
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .yard { height: 62vh; order: -1; }
  aside.left, aside.right { border: 0; border-top: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.spick { position: relative; display: inline-block; }
.spick > button { display: inline-flex; align-items: center; gap: 6px; }
.spick .sw { width: 22px; height: 16px; border: 1px solid var(--line); border-radius: 3px; flex: none; }
.spick .grid { position: absolute; z-index: 20; top: 100%; left: 0; display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.spick .grid button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px; font-size: 11px; }
.spick .grid button .sw { width: 52px; height: 36px; }
.spick .grid button.on { outline: 2px solid var(--accent); }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">Ship Designer<small id="shipname">loading</small></div>
    <nav class="modes" aria-label="Mode">
      <button id="m-hull" class="on">Hull</button>
      <button id="m-pieces">Pieces</button>
      <button id="m-interior">Interior</button>
      <select id="m-rooms" aria-label="Room view"><option value="">Room view</option></select>
      <button id="m-connectors">Connectors</button>
    </nav>
    <div class="grow"></div>
    <div class="tools">
      <select id="start" aria-label="Start from" title="Start a new design from"></select>
      <button id="undo" disabled title="Ctrl+Z (Ctrl+C, Ctrl+X, Ctrl+V copy, cut and paste what is picked)">Undo</button>
      <button id="redo" disabled title="Ctrl+Y or Ctrl+Shift+Z">Redo</button>
      <button id="file">Design file</button>
    </div>
  </header>
  <div class="main">
    <aside class="left" id="left"></aside>
    <div class="yard" id="yard">
      <div class="boot" id="boot">Starting the designer (the game's C#, as WebAssembly)...</div>
      <div class="hud" id="hud">
        <button id="v-frame">Frame ship</button>
        <button id="v-xray">X-ray hull</button>
        <button id="v-rooms" class="on">Rooms</button>
        <button id="v-links" class="on">Socket links</button>
        <button id="v-person" class="on">Person</button>
        <button id="v-hull" class="on" title="Show or hide the hull (and its connections) outside the Hull tab">Hull shown</button>
        <button id="v-parts" class="on" title="Show or hide the pieces on the hull outside the Pieces tab">Parts shown</button>
        <button id="v-lights" title="Turn the floodlights on: each lights the scene along its beam">Lights</button>
      </div>
      <div class="tip" id="tip"></div>
    </div>
    <aside class="right">
      <div class="sec" id="inspect"></div>
      <div class="sec"><h2>Checks <span class="n" id="icount"></span></h2><ul class="issues" id="issues"></ul></div>
      <div class="sec"><h2>Ship</h2><div class="stats" id="stats"></div></div>
    </aside>
  </div>
</div>

<dialog id="dlg">
  <div class="sec">
    <h2>Design file</h2>
    <p class="hint">The design as JSON. Copy it to keep it (the game will read this file), or paste one in and load it.</p>
    <textarea id="dtext" spellcheck="false" aria-label="Design JSON"></textarea>
    <div class="row"><button id="dcopy" class="primary">Copy</button><button id="dload">Load this text</button><span class="grow"></span><button id="dclose">Close</button></div>
    <div class="hint" id="dmsg"></div>
  </div>
</dialog>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";

const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } for (const k of kids) e.append(k); return e; };
const fmt = v => (Math.round(v * 100) / 100).toString();

// ---------- the C# side
let api;
async function bootCs() {
  const { dotnet } = await import(new URL("framework/dotnet.js", document.baseURI).href);
  const rt = await dotnet.create();
  const exp = await rt.getAssemblyExports("ShipDesigner.Web.dll");
  api = exp.CallOfSlop.ShipDesigner.Api;
}

let S = null;          // the scene from C#
let CAT = null;        // the catalogue
const sel = { kind: null, id: 0, station: -1 };
let mode = "hull";
const view = { xray: false, rooms: true, links: true, person: true, hull: true, parts: true, lights: false };
let deck = 0;
// Room view (Interior tab): only one room (and, ticked, the rooms a door or a riser joins to it) with its walls and interior; the model
// builds nothing else while it is on. { room, connected } or null.
let roomView = null;
let roomOpaque = false; // Room view's Opaque box (Karl, 2026-11-25): shells, walls and floor drawn solid
let roomCut = 100; // Room view's Cutaway slider, % of the room's height (100: no cut); a horizontal clipping plane on every mesh drawn
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);

function take(answerText) {
  const a = JSON.parse(answerText);
  S = a.scene;
  if (roomView && !S.roomView) { roomView = null; viewCmd(); return a; } // its room went (deleted, undone): back to the ship
  for (const h of S.hulls) if (h.copies) hullCopies.set(h.id, h.copies.map(c => ({ copy: c.copy, cladFit: c.cladFit, skin: { p: c.skin.p.length ? [0] : [] }, fore: { p: c.fore.p.length ? [0] : [] }, aft: { p: c.aft.p.length ? [0] : [] } })));
  $("undo").disabled = !a.undo; $("redo").disabled = !a.redo;
  if (a.error) toast(a.error);
  tabs();
  rebuild();
  panels();
  if (S.hulls.every(h => h.copies)) try { localStorage.setItem("shipdesigner.design", api.Save()); } catch (e) {}
  return a;
}
const timing = { cs: 0, js: 0, size: 0 }; // the last command's time in C# and in the page, and its answer's length (for a page test)
// Room view in or out: a scene with only the rooms it needs (no edit, no undo step).
function viewCmd(fit = false) {
  const t0 = performance.now(), text = api.Apply(JSON.stringify({ op: "view", roomView })), t1 = performance.now();
  const a = take(text);
  if (fit) frameRoom();
  timing.cs = t1 - t0; timing.js = performance.now() - t1; timing.size = text.length;
  return a;
}
function enterRoomView(id, connected = roomView?.connected ?? false) {
  if (!S.rooms.some(r => r.id === id)) { toast("Pick a room first."); return; }
  if (mounting) stopMount();
  mode = "interior";
  const r = S.rooms.find(r => r.id === id); deck = r.deck;
  roomView = { room: id, connected }; sel.kind = "room"; sel.id = id; sel.station = -1;
  tabs();
  viewCmd(true);
}
function exitRoomView() { if (!roomView) return; roomView = null; tabs(); viewCmd(); frame(); }
// The tab row: the mode buttons, and Room view's drop-down (its first entry the tab's name, then every room by name and deck).
function tabs() {
  for (const k of ["hull", "pieces", "interior", "connectors"]) $("m-" + k).classList.toggle("on", !roomView && k === mode);
  const t = $("m-rooms"); if (!t || !S) return;
  t.replaceChildren(el("option", { value: "" }, "Room view"),
    ...S.rooms.map(r => el("option", { value: r.id, ...(roomView?.room === r.id ? { selected: "" } : {}) }, `${r.label || r.kind} (deck ${r.deck + 1})`)));
  t.value = roomView ? String(roomView.room) : "";
  t.classList.toggle("on", !!roomView);
}
// The camera on the room (and its neighbours when they show).
function frameRoom() {
  const box = new THREE.Box3();
  world.traverse(o => { if (o.isMesh && o.userData.type === "room" && (!roomView || o.userData.id === roomView.room)) box.expandByObject(o); });
  if (box.isEmpty()) return;
  // Karl, 2026-11-25: keep the camera's angle and distance, only the orbit target moves to the room's middle.
  const c = box.getCenter(new THREE.Vector3()), off = camera.position.clone().sub(controls.target);
  controls.target.copy(c);
  camera.position.copy(c).add(off);
  controls.update();
}
function cmd(op, merge = false) {
  op.merge = merge;
  const t0 = performance.now(), text = api.Apply(JSON.stringify(op)), t1 = performance.now();
  const a = take(text);
  timing.cs = t1 - t0; timing.js = performance.now() - t1; timing.size = text.length; if (timing.keep) timing.text = text;
  return a;
}

// A drag sends a command a frame at most; its first is an undo step, the rest merge into it.
let pending = null, dragFirst = true;
function dragCmd(op) { pending = op; }
// A drag's commands are throttled by their own cost (2026-11-27): the frame's flush waits as long as the last command took, so a big
// design still redraws live during a drag and the page keeps half its time. A release flushes at once.
let flushAfter = 0;
function flush(frame = false) {
  if (!pending || (frame && performance.now() < flushAfter)) return;
  const op = pending; pending = null; const t0 = performance.now();
  const a = cmd(op, !dragFirst); dragFirst = false;
  flushAfter = performance.now() + Math.min(250, performance.now() - t0);
  return a;
}

let toastTimer;
function toast(msg, info = false) {
  let t = document.querySelector(".toast");
  if (!t) { t = el("div", { class: "toast" }); $("yard").append(t); }
  t.className = "toast" + (info ? " info" : ""); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200);
}

// ---------- three
const yard = $("yard");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
yard.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2329);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
camera.position.set(38, 22, -12);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 22);
controls.enableDamping = true;
controls.mouseButtons.MIDDLE = THREE.MOUSE.ROTATE; // Karl, 2026-11-24: the middle button turns the view (the wheel zooms)
scene.add(new THREE.HemisphereLight(0xdfe9f2, 0x2a3036, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(30, 50, -20); scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fc0e0, 0.5); fill.position.set(-30, -10, 40); scene.add(fill);
// Metals need something to reflect: a small room environment, prefiltered once, given only to the non-painted materials (so Painted keeps its old look).
// A generated gradient (sky, a bright horizon band, dark ground) on a sphere, so it is cheap and needs no file or untone-mapped room.
const envMap = (() => {
  const es = new THREE.Scene(), g = new THREE.SphereGeometry(10, 32, 16), pos = g.attributes.position, col = [];
  const sky = new THREE.Color(0x8fa6bd), hor = new THREE.Color(0xe8eef4), gnd = new THREE.Color(0x2b3036), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) { const y = pos.getY(i) / 10; if (y > 0) c.copy(hor).lerp(sky, Math.min(1, y * 1.6)); else c.copy(hor).lerp(gnd, Math.min(1, -y * 3)); col.push(c.r, c.g, c.b); }
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  es.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const t = new THREE.PMREMGenerator(renderer).fromScene(es, 0.02).texture; g.dispose(); return t;
})();
// Each body material as three.js properties (tint multiplies the vertex colours, so paint, wear and damage still show).
const MATS = {
  "Painted": null,
  "Steel": { metalness: 0.85, roughness: 0.38, color: 0xc8ccd0 },
  "Brushed aluminium": { metalness: 0.9, roughness: 0.5, color: 0xe4e7ea },
  "Titanium": { metalness: 0.8, roughness: 0.3, color: 0xb6b2a8 },
  "Copper": { metalness: 0.95, roughness: 0.28, color: 0xf0a070 },
  "Gloss plastic": { metalness: 0, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.08 },
  "Matte plastic": { metalness: 0, roughness: 0.92 },
  "Carbon": { metalness: 0.2, roughness: 0.42, color: 0x3a3d42, clearcoat: 0.8, clearcoatRoughness: 0.2 },
};
const MAT_NAMES = Object.keys(MATS);
// Damage wears the cladding's material (built from the scene each draw, so a damage-only change shows): rougher, less metal, less clearcoat.
function wornOpts(o, dmg) {
  if (!(dmg > 0)) return o;
  const w = { ...o, roughness: Math.min(1, (o.roughness ?? 0.7) + 0.45 * dmg), metalness: (o.metalness ?? 0.15) * (1 - 0.55 * dmg) };
  if (o.clearcoat !== undefined) { w.clearcoat = o.clearcoat * (1 - dmg); w.clearcoatRoughness = Math.min(1, (o.clearcoatRoughness ?? 0) + 0.6 * dmg); }
  if (o.envMapIntensity !== undefined) w.envMapIntensity = o.envMapIntensity * (1 - 0.45 * dmg);
  return w;
}
// The opts for a mesh in a material (empty for Painted); clearcoat asks for MeshPhysicalMaterial.
function matOpts(name) { const m = MATS[name]; return m ? { ...m, envMap, envMapIntensity: 0.8 } : {}; }
const grid = new THREE.GridHelper(200, 100, 0x3a4852, 0x26323a); scene.add(grid);
const world = new THREE.Group(); scene.add(world);
const gizmo = new TransformControls(camera, renderer.domElement);
gizmo.setTranslationSnap(0.25); gizmo.setSize(0.8);
scene.add(gizmo);
gizmo.addEventListener("dragging-changed", e => {
  controls.enabled = !e.value;
  if (e.value) { dragFirst = true; return; }

// Passages through an arm between bodies (Karl, 2026-11-26): a glass tube along the arm's curved spine from a door in one room

function drawPassages(only = null) {
  for (const k of S.passages || []) {
    if (k.pts.length < 6 || (only && !only.has(k.a) && !only.has(k.b))) continue;
    const P = [], U = [];
    for (let i = 0; i + 2 < k.pts.length; i += 3) { P.push(new THREE.Vector3(k.pts[i], k.pts[i + 1], k.pts[i + 2])); U.push(new THREE.Vector3(k.ups[i], k.ups[i + 1], k.ups[i + 2]).normalize()); }
    const picked = sel.kind === "passage" && sel.id === k.id, rad = Math.max(0.35, Math.min(0.75, (k.clear || 1.2) / 2));
    const curve = new THREE.CatmullRomCurve3(P, false, "centripetal");
    const g = new THREE.Group();
    const glass = new THREE.MeshStandardMaterial({ color: k.ok ? 0x9fd3ff : 0xff6a50, transparent: true, opacity: only ? 0.18 : 0.32, depthWrite: false, side: THREE.DoubleSide, emissive: picked ? 0x1d4f86 : 0x000000 });
    const steel = new THREE.MeshStandardMaterial({ color: k.ok ? 0xd8b04a : 0xff5a44, metalness: 0.5, roughness: 0.4, emissive: picked ? 0x1d4f86 : 0x000000 });
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(24, P.length * 8), rad, 14, false), glass);
    tube.userData = { type: "passage", id: k.id }; g.add(tube); pickables.push(tube);
    // Its walls, floor and roof as the game builds them (DesignPassage.cs): drawn instead of the track and planks; the glass is what is picked.
    if (k.mesh) {
      glass.opacity = only ? 0.06 : 0.1;
      const o = meshFrom(k.mesh, { metalness: 0.4, roughness: 0.55, emissive: picked ? 0x1d4f86 : 0x000000 }); o.userData = { type: "passage", id: k.id }; g.add(o);
      g.traverse(o => { o.renderOrder = 5; }); world.add(g); continue;
    }
    // Its track: two rails on the tube's floor, each frame's up from the model (the arm's own up inside it).
    const N = Math.max(24, P.length * 8), side = new THREE.Vector3(), rails = [[], []], ups = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, p = curve.getPointAt(t), tg = curve.getTangentAt(t), f = Math.min(U.length - 1.001, t * (U.length - 1)), up = U[Math.floor(f)].clone().lerp(U[Math.ceil(f)], f - Math.floor(f)).normalize();
      side.crossVectors(tg, up).normalize(); const fl = up; ups.push(fl);
      for (const [j, s] of [[0, -1], [1, 1]]) rails[j].push(p.clone().addScaledVector(fl, -rad * 0.82).addScaledVector(side, s * rad * 0.42));
    }
    for (const r of rails) { const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(r), N, 0.035, 6, false), steel); m.userData = { type: "passage", id: k.id }; g.add(m); pickables.push(m); }
    // The car (a lift's) at the middle, facing along the track; a walkway gets a grating strip instead.
    if (k.kind === "Lift") {
      const t = 0.5, p = curve.getPointAt(t), tg = curve.getTangentAt(t), up = ups[Math.round(t * N)], ch = Math.min(1.9, 2 * rad * 0.85);
      const car = new THREE.Mesh(new THREE.BoxGeometry(rad * 1.2, ch, Math.min(1.4, rad * 1.8)), new THREE.MeshStandardMaterial({ color: 0x9aa3ad, metalness: 0.6, roughness: 0.4, emissive: picked ? 0x1d4f86 : 0x000000 }));
      const m4 = new THREE.Matrix4(), sd = new THREE.Vector3().crossVectors(up, tg).normalize(), u2 = new THREE.Vector3().crossVectors(tg, sd).normalize();
      m4.makeBasis(sd, u2, tg); car.quaternion.setFromRotationMatrix(m4);
      car.position.copy(p).addScaledVector(u2, -rad * 0.82 + ch / 2 + 0.05); car.userData = { type: "passage", id: k.id }; g.add(car); pickables.push(car);
    } else for (let i = 0; i < N; i += 2) {
      const p = curve.getPointAt((i + 0.5) / N), tg = curve.getTangentAt((i + 0.5) / N), up = ups[i], sd = new THREE.Vector3().crossVectors(up, tg).normalize(), u2 = new THREE.Vector3().crossVectors(tg, sd).normalize();
      const plank = new THREE.Mesh(new THREE.BoxGeometry(rad * 1.1, 0.03, curve.getLength() / N * 1.6), steel), m4 = new THREE.Matrix4();
      m4.makeBasis(sd, u2, tg); plank.quaternion.setFromRotationMatrix(m4); plank.position.copy(p).addScaledVector(u2, -rad * 0.8); g.add(plank);
    }
    // A door frame at each end, in the room's wall, facing along the tube.
    for (const [p, tg] of [[P[0], curve.getTangentAt(0)], [P[P.length - 1], curve.getTangentAt(1)]]) {
      const fr = new THREE.Group(), up = S.stacked ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0), flat = tg.clone().addScaledVector(up, -tg.dot(up)).normalize();
      const sd = new THREE.Vector3().crossVectors(up, flat).normalize(), m4 = new THREE.Matrix4(); m4.makeBasis(sd, up, flat); fr.quaternion.setFromRotationMatrix(m4); fr.position.copy(p);
      for (const [bw, bh, x, y] of [[0.1, 2.1, -0.5, 0], [0.1, 2.1, 0.5, 0], [1.1, 0.1, 0, 1.05]]) { const b = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.2), steel); b.position.set(x, y, 0); fr.add(b); }
      g.add(fr);

}
// The deck a new ladder or lift reaches from this one: the next deck up (fore when stacked), else the next one down.
function otherDeck(i, dir = 1) {
  const order = S.decks.map((d, j) => [d.floor, j]).sort((p, q) => p[0] - q[0]).map(p => p[1]), at = order.indexOf(i);
  if (dir < 0) return at > 0 ? order[at - 1] : -1;
  return at + 1 < order.length ? order[at + 1] : -1;
}

// Windows in the hull (Karl, 2026-11-24): glass laid on the skin from a grid of points, so it follows the contour, with a frame
// round its edge. Pickable from the Interior and Pieces views.
function drawHullWindows() {
  for (const w of S.hullWindows || []) {
    const { nu, nv, pts } = w; if (nu < 2 || nv < 2) continue;
    const picked = sel.kind === "hullwin" && sel.id === w.id;
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    // A shaped window (Karl, 2026-11-24) is a fan of rings from its middle: row nv - 1 is its rim, and it wraps round.
    const shaped = w.shape && w.shape !== "Rect";
    const idx = []; for (let j = 0; j < nv - 1; j++) for (let i = 0; i < (shaped ? nu : nu - 1); i++) { const a = j * nu + i, b = j * nu + (i + 1) % nu, c = a + nu, d = b + nu; idx.push(a, b, d, a, d, c); }
    g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: w.ok ? 0x9fd3ff : 0xff8a70, metalness: 0.3, roughness: 0.1, transparent: true, opacity: 0.55, side: THREE.DoubleSide, emissive: picked ? 0x1d4f86 : 0x0b2236, depthWrite: false }));
    m.userData = { type: "hullwin", id: w.id }; m.renderOrder = 5; world.add(m); pickables.push(m);
    const ring = []; const P = k => new THREE.Vector3(pts[3 * k], pts[3 * k + 1], pts[3 * k + 2]);
    if (shaped) { for (let i = 0; i <= nu; i++) ring.push(P((nv - 1) * nu + i % nu)); }
    else { for (let i = 0; i < nu; i++) ring.push(P(i)); for (let j = 1; j < nv; j++) ring.push(P(j * nu + nu - 1));
      for (let i = nu - 2; i >= 0; i--) ring.push(P((nv - 1) * nu + i)); for (let j = nv - 2; j >= 0; j--) ring.push(P(j * nu)); }
    // Double glazing (Karl, 2026-11-25): the glass above is the outer pane, on the skin; an inner pane sits w.depth in along the window's
    // ray (never on the outer's plane), and a reveal lines the tunnel between their rims. Single glazed: the one pane at that depth instead.
    if (w.n && w.depth > 0) {
      const dn = new THREE.Vector3(...w.n).multiplyScalar(-Math.max(0.05, w.depth));
      const ip = new Float32Array(pts.length); for (let k = 0; k < pts.length; k += 3) { ip[k] = pts[k] + dn.x; ip[k + 1] = pts[k + 1] + dn.y; ip[k + 2] = pts[k + 2] + dn.z; }
      const ig = new THREE.BufferGeometry(); ig.setAttribute("position", new THREE.Float32BufferAttribute(ip, 3)); ig.setIndex(idx); ig.computeVertexNormals();
      const im = new THREE.Mesh(ig, m.material); im.userData = m.userData; im.renderOrder = 5; world.add(im); pickables.push(im);
      if (w.double === false) m.visible = false;
      const rp = [], ri = [], R = ring.length;
      for (const v of ring) rp.push(v.x, v.y, v.z, v.x + dn.x, v.y + dn.y, v.z + dn.z);
      for (let k = 0; k < R - 1; k++) { const a = 2 * k, b = 2 * (k + 1); ri.push(a, b, b + 1, a, b + 1, a + 1); }
      const rg = new THREE.BufferGeometry(); rg.setAttribute("position", new THREE.Float32BufferAttribute(rp, 3)); rg.setIndex(ri); rg.computeVertexNormals();
      const rv = new THREE.Mesh(rg, new THREE.MeshStandardMaterial({ color: 0x4b5058, roughness: 0.7, metalness: 0.3, side: THREE.DoubleSide }));
      rv.userData = m.userData; world.add(rv); pickables.push(rv);
    }
    if (w.frameOut !== false || picked) { // (the rim's line is its outside frame's edge; picked, it shows the selection)
      const frame = new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring), new THREE.LineBasicMaterial({ color: picked ? 0x6fb0ff : 0x2f3237 }));
      frame.renderOrder = 6; world.add(frame); }
    // Boarding round the glass (Karl, 2026-11-24): a band 10 cm wide laid on the skin by the same rays as the glass (fpts), from
    // the glass's edge out to its own, standing a little proud, so it follows the contour and covers the cut edge.
    if (!(w.fnu >= 2 && w.fnv >= 2)) continue;
    const sides = (q, a, b) => { const Q = k => new THREE.Vector3(q[3 * k], q[3 * k + 1], q[3 * k + 2]), s4 = [[], [], [], []];
      for (let i = 0; i < a; i++) s4[0].push(Q(i)); for (let j = 0; j < b; j++) s4[1].push(Q(j * a + a - 1));
      for (let i = a - 1; i >= 0; i--) s4[2].push(Q((b - 1) * a + i)); for (let j = b - 1; j >= 0; j--) s4[3].push(Q(j * a)); return s4; };
    const resample = (line, K) => { const L = [0]; for (let i = 1; i < line.length; i++) L.push(L[i - 1] + line[i].distanceTo(line[i - 1])); const T = L[L.length - 1] || 1, out = [];
      for (let k = 0; k < K; k++) { const t = T * k / (K - 1); let i = 1; while (i < line.length - 1 && L[i] < t) i++; const f = (t - L[i - 1]) / ((L[i] - L[i - 1]) || 1); out.push(line[i - 1].clone().lerp(line[i], Math.min(1, Math.max(0, f)))); } return out; };
    const si = sides(pts, nu, nv), so = sides(w.fpts, w.fnu, w.fnv), inner = [], outer = [];
    if (shaped) { const Q = (q, a, b, i) => new THREE.Vector3(q[3 * ((b - 1) * a + i)], q[3 * ((b - 1) * a + i) + 1], q[3 * ((b - 1) * a + i) + 2]);
      for (let i = 0; i < nu; i++) { inner.push(Q(pts, nu, nv, i)); outer.push(Q(w.fpts, w.fnu, w.fnv, i % w.fnu)); } }
    else for (let e = 0; e < 4; e++) { const K = Math.max(si[e].length, so[e].length) * 2; const a = resample(si[e], K), b = resample(so[e], K); a.pop(); b.pop(); inner.push(...a); outer.push(...b); }
    const N = inner.length;
    const bp = [], bi = [];

    for (let k = 0; k < N; k++) { const a = 2 * k, b = 2 * ((k + 1) % N); bi.push(a, b, b + 1, a, b + 1, a + 1); }
    const bg = new THREE.BufferGeometry(); bg.setAttribute("position", new THREE.Float32BufferAttribute(bp, 3)); bg.setIndex(bi); bg.computeVertexNormals();
    const board = new THREE.Mesh(bg, new THREE.MeshStandardMaterial({ color: picked ? 0x4a6f9a : 0x3a3e44, roughness: 0.6, metalness: 0.4, side: THREE.DoubleSide }));
    board.userData = { type: "hullwin", id: w.id }; world.add(board); pickables.push(board);
  }
}

// A socket's connector to a room farther than its reach: a lined shaft like the Limpet's, with rungs when it climbs and a

function drawConnectors() {
  for (const l of S.links) {

      for (const [x, y, w, h] of [[0, 0.37, 0.8, 0.05], [0, -0.37, 0.8, 0.05], [0.37, 0, 0.05, 0.8], [-0.37, 0, 0.05, 0.8]]) { const f = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), amber); f.position.set(x, y, 0.04); g.add(f); }
      const len = Math.max(0.05, d.length()), pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, len, 8), steel); pipe.rotation.x = Math.PI / 2; pipe.position.z = len / 2; g.add(pipe);

    const a = new THREE.Vector3(...l.a), b = new THREE.Vector3(...l.b), d = b.clone().sub(a), len = d.length(); if (len < 0.1) continue;
    const g = new THREE.Group(), w = l.shaft + 0.2, dir = d.clone().normalize();

    const amber = new THREE.MeshStandardMaterial({ color: 0xd8b04a, metalness: 0.5, roughness: 0.4 });
    // The hazard frames at both mouths.
    for (const y of [-len / 2, len / 2]) for (const [sx, sz, bx, bz] of [[0, w / 2, w + 0.1, 0.08], [0, -w / 2, w + 0.1, 0.08], [w / 2, 0, 0.08, w + 0.1], [-w / 2, 0, 0.08, w + 0.1]]) {
      const f = new THREE.Mesh(new THREE.BoxGeometry(bx, 0.1, bz), amber); f.position.set(sx, y, sz); g.add(f);

function drawLinks() {
  for (const l of S.links) {
    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...l.a), new THREE.Vector3(...l.b)]);

      ...(mergeAcross && mergeAcross.a === r.id ? (() => { const o = S.rooms.find(q => q.id === mergeAcross.b); if (!o) return []; const go = owner => { const a = cmd({ op: "mergeRoom", a: mergeAcross.a, b: mergeAcross.b, owner }); mergeAcross = null; if (a.error) toast(a.error); else { const kept = S.rooms.find(q => q.id === (owner === "a" ? r.id : o.id)); if (kept) { deck = kept.deck; select("room", kept.id); } toast("Merged through both decks. Undo splits them again.", true); } };

            el("button", { onclick: () => { const a = cmd({ op: "delExt", id: r.id, i }); if (a.error) toast(a.error); else { rebuild(); inspector(); } } }, "Delete")),
          slider(e.side === "up" ? "Rise" : "Depth", Math.round(e.depth * 100), 25, 600, 5, " cm", () => {}, v => set({ depth: v / 100 })),
          ...(e.side === "up" ? [] : [slider("Width", Math.round(e.width * 100), 50, 1200, 5, " cm", () => {}, v => set({ width: v / 100 })),
            slider("Along the wall", Math.round(e.t * 100), 0, 100, 1, "%", () => {}, v => set({ t: v / 100 }))])]; }),
      el("p", { class: "hint" }, "Grows the room out of a wall (a box, an angled bay, half a hexagon or a round apse) or raises its ceiling (vaulted, gabled or chamfered). Red: it pokes through the skin."),
      ...(roomView ? [el("h3", {}, "Walls"),
      slider("Wall thickness", Math.round((r.wallThick ?? 0.1) * 100), 0, 30, 1, " cm", () => {}, v => { const a = cmd({ op: "setRoom", id: r.id, wallThick: v / 100 }); if (a.error) toast(a.error); }, dflt("room", "wallThick", 100)),
      el("div", { class: "row" }, resetAll("Wall thickness back to its default", () => { const a = cmd({ op: "setRoom", id: r.id, ...dfltOf("room", ["wallThick"]) }); if (a.error) toast(a.error); })),
      el("p", { class: "hint" }, "A shell inside the room's box, so each room has its own walls, back to back with its neighbour's. It stops at the skin and leaves doors between rooms open (0: none)."),
      (() => { const setW = o => { const a = cmd({ op: "setRoom", id: r.id, ...o }); if (a.error) toast(a.error); else { rebuild(); inspector(); } };
        const wc = el("input", { type: "color", value: r.wallColour || "#6b7480", "aria-label": "Wall colour" }); wc.addEventListener("change", () => setW({ wallColour: wc.value }));
        return el("div", {},
          el("div", { class: "row" }, el("span", {}, "Cladding"), swatchPick("Wall cladding", r.wallStyle || "Plain", ["Plain", "Panels", "Ribbed", "Padded", "Grate", "Conduit", "Hex", "Industrial", "Corridor", "Zero Day"], k => setW({ wallStyle: k })),
            el("span", {}, "Colour"), wc, el("button", { onclick: () => setW({ wallColour: "" }) }, "Kind's")),
          el("div", { class: "row" }, el("span", {}, "Floor"), swatchPick("Floor", r.floor || "Plates", ["Plates", "Hex", "Plain", "Diamond", "Grating", "Tiles", "Rubber", "Wood", "Hazard"], k => setW({ floor: k }))),
          slider("Seed", r.seed ?? 0, 0, 999, 1, "", () => {}, v => setW({ seed: v }), dflt("room", "seed")),
          el("div", { class: "row" }, resetAll("Cladding, colour, floor and seed back to their defaults", () => setW({ ...dfltOf("room", ["wallStyle", "wallColour", "floor", "seed"]), ...(r.kind === "Corridor" ? CAT.defaults.corridor || {} : {}) }))),
          el("p", { class: "hint" }, "Cladding is relief on the walls when the interior style is Off (the interior has its own). Plates and Hex floors are the interior's plate layer; the others are laid with or without it.")); })(),
      el("h3", {}, "Interior"),
      (() => { const setI = o => { const a = cmd({ op: "setRoom", id: r.id, ...o }); if (a.error) toast(a.error); else { rebuild(); inspector(); } };
        const colour = (v, label, key) => { const c = el("input", { type: "color", value: v, "aria-label": label }); c.addEventListener("change", () => setI({ [key]: c.value })); return c; };
        return el("div", {},
          el("div", { class: "row" }, el("span", {}, "Style"), ...["Off", "Clean", "Industrial"].map(k => el("button", { class: (r.interior || "Off") === k ? "on" : "", onclick: () => setI({ interior: k }) }, k))),
          slider("Rib spacing", r.ribSpacing ?? 2, 1, 4, 0.25, " m", () => {}, v => setI({ ribSpacing: v }), dflt("room", "ribSpacing")),
          el("div", { class: "row" }, resetAll("Rib spacing back to its default", () => setI(dfltOf("room", ["ribSpacing"])))),
          el("div", { class: "row" }, el("span", {}, "Panels"), colour(r.panelColour || "#d9dee3", "Panel colour", "panelColour"), el("span", {}, "Trim"), colour(r.trimColour || "#e0a526", "Trim colour", "trimColour"),
            el("button", { class: r.lights !== false ? "on" : "", onclick: () => setI({ lights: r.lights === false }) }, r.lights !== false ? "Lights on" : "Lights off")),

      slider("Size", Math.round(pieceSize * 100), 25, 400, 5, "%", v => { pieceSize = v / 100; }),
      slider("Recess into the wall", Math.round(pieceRecess * 100), 0, 200, 5, " cm", v => { pieceRecess = v / 100; }),

        el("button", { onclick: () => { const a = cmd({ op: "splitRoom", id: r.id }); if (!a.error) select("room", a.id); } }, "Split"),

function checks() {
  const ul = $("issues"); ul.replaceChildren();
  const errs = S.issues.filter(i => i.level === "error").length;
  $("icount").textContent = S.issues.length ? `${errs} to fix, ${S.issues.length - errs} to look at` : "all clear";
  if (!S.issues.length) ul.append(el("li", { class: "good" }, "Every room fits, every socket opens into a room, and every room can be reached."));
  for (const i of S.issues) ul.append(el("li", { class: i.level, onclick: () => {
    const [k, id] = i.what.split(":");
    if (k === "room") { const r = S.rooms.find(r => r.id === +id); if (r) { deck = r.deck; if (mode !== "interior") setMode("interior"); select("room", +id); } }
    else if (k === "piece") { if (mode !== "pieces") setMode("pieces"); select("piece", +id); }
    else if (k === "passage") { if (mode !== "interior") setMode("interior"); select("passage", +id); }
  } }, i.text));
  const st = S.stats;
  $("stats").replaceChildren(...[["length", `${fmt(st.length)} m`], ["beam", `${fmt(st.beam)} m`], ["height", `${fmt(st.height)} m`], ["floor", `${fmt(st.floor)} m2`],
    ["cargo hold", `${fmt(st.hold)} m3`], ["bunks", `${st.bunks}`], ["rooms", `${st.rooms}${st.podRooms ? ` (${st.podRooms} in pods)` : ""}`], ...(st.podRooms ? [["pod floor", `${fmt(st.podFloor)} m2`]] : []), ...(st.passages ? [["passages", `${st.passages}`]] : []), ["pieces", `${st.pieces}`]].map(([k, v]) => el("div", { class: "stat" }, el("b", {}, v), el("span", {}, k))));
}

// ---------- the bar
for (const k of ["hull", "pieces", "interior", "connectors"]) $("m-" + k).addEventListener("click", () => setMode(k));
$("m-rooms").addEventListener("change", e => { const id = +e.target.value; if (id) enterRoomView(id); else exitRoomView(); });
$("undo").addEventListener("click", () => { take(api.Undo()); panels(); });
$("redo").addEventListener("click", () => { take(api.Redo()); panels(); });
$("start").addEventListener("change", e => { if (!e.target.value) return; cmd({ op: "start", name: e.target.value }); e.target.value = ""; select(null, 0); frame(); });
$("file").addEventListener("click", () => { $("dtext").value = api.Save(); $("dmsg").textContent = ""; $("dlg").showModal(); });
$("dclose").addEventListener("click", () => $("dlg").close());
$("dcopy").addEventListener("click", () => {
  navigator.clipboard.writeText($("dtext").value).then(() => $("dmsg").textContent = "Copied.", () => { $("dtext").select(); $("dmsg").textContent = "Selected: press Ctrl+C to copy."; });
});
$("dload").addEventListener("click", () => {
  const a = cmd({ op: "load", json: $("dtext").value });
  $("dmsg").textContent = a.error ? "Not loaded: " + a.error : "Loaded.";
  if (!a.error) { select(null, 0); frame(); }
});
$("v-frame").addEventListener("click", frame);
const toggle = (id, key) => $(id).addEventListener("click", () => { view[key] = !view[key]; $(id).classList.toggle("on", view[key]); rebuild(); });
toggle("v-xray", "xray"); toggle("v-rooms", "rooms"); toggle("v-links", "links"); toggle("v-person", "person"); toggle("v-hull", "hull"); toggle("v-parts", "parts"); toggle("v-lights", "lights");
window.addEventListener("keydown", e => {
  if (e.target.closest?.("input, textarea, select")) return;
  const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (ctrl && k === "z" && !e.shiftKey) { e.preventDefault(); $("undo").click(); }
  else if (ctrl && (k === "y" || (k === "z" && e.shiftKey))) { e.preventDefault(); $("redo").click(); }
  else if (ctrl && (k === "c" || k === "x")) {
    if (!sel.kind) return;
    e.preventDefault(); clip = { kind: sel.kind, id: sel.id };
    if (k === "x") { if (sel.kind === "piece") cmd({ op: "delPiece", id: sel.id }); else if (sel.kind === "room") cmd({ op: "delRoom", id: sel.id }); else if (sel.kind === "hull") cmd({ op: "delHull", hull: sel.id }); clip.cut = true; select(null, 0); }
    else toast("Copied. Ctrl+V pastes a copy beside it.", true);
  } else if (ctrl && k === "v") {
    if (!clip) return; e.preventDefault();
    if (clip.cut) { $("undo").click(); clip.cut = false; toast("Pasted back.", true); return; } // (a cut thing keeps its place)
    const a = clip.kind === "piece" ? cmd({ op: "pastePiece", id: clip.id, dz: 2 }) : clip.kind === "room" ? cmd({ op: "pasteRoom", id: clip.id }) : cmd({ op: "copyHull", hull: clip.id });
    if (!a.error) { if (clip.kind === "hull") select("hull", S.hulls[S.hulls.length - 1].id); else { select(clip.kind, a.id); clip = { kind: clip.kind, id: a.id }; } }
  } else if (ctrl && k === "d" && sel.kind) { e.preventDefault(); clip = { kind: sel.kind, id: sel.id }; window.dispatchEvent(new KeyboardEvent("keydown", { key: "v", ctrlKey: true })); }
  else if (e.key === "Delete" || e.key === "Backspace") {
    if (sel.kind === "piece") { cmd({ op: "delPiece", id: sel.id }); select(null, 0); }
    else if (sel.kind === "room") { cmd({ op: "delRoom", id: sel.id }); select(null, 0); }
    else if (sel.kind === "join") { cmd({ op: "delJoin", id: sel.id }); select(null, 0); }
    else if (sel.kind === "riser") { cmd({ op: "delRiser", id: sel.id }); select(null, 0); }
    else if (sel.kind === "passage") { cmd({ op: "delPassage", id: sel.id }); select(null, 0); }
    else if (sel.kind === "door") { cmd({ op: "delDoor", id: sel.id }); select(null, 0); }
    else if (sel.kind === "hullwin") { cmd({ op: "delHullWindow", id: sel.id }); select(null, 0); }
    else if (sel.kind === "hull") { const a = cmd({ op: "delHull", hull: sel.id }); if (!a.error) select(null, 0); }
  } else if (e.key === "Escape") { if (linking) { linking = null; leftPanel(); rebuild(); } else if (mounting) stopMount(); else if (roomView) exitRoomView(); else select(null, 0); }
});

window.shipDesigner = { cmd, enterRoomView, exitRoomView, roomView: () => roomView, world, selectStation, select, setMode, camera, controls, timing }; // (for a page test)
function loop() { requestAnimationFrame(loop); flush(true); mountTick(); controls.update(); renderer.render(scene, camera); }

try {
  await bootCs();

  const st = $("start"); st.append(el("option", { value: "" }, "New from...")); for (const s of CAT.starts) st.append(el("option", { value: s }, s));
