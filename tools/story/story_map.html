<title>Story Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #e9ecea; --panel: #f7f8f6; --ink: #1c2422; --muted: #5d6965; --line: #c7cfcb;
  --accent: #2b5c78; --a: #2b5c78; --b: #6a7a2c; --u: #b0352b; --sel: #d8e6ee; --edge: #8fa3ad;
  --sans: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161b1a; --panel: #1f2624; --ink: #e2e8e5; --muted: #95a39e; --line: #34403c;
  --accent: #7fb3d1; --a: #7fb3d1; --b: #b4c46a; --u: #ef7a6c; --sel: #24384a; --edge: #50646c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161b1a; --panel: #1f2624; --ink: #e2e8e5; --muted: #95a39e; --line: #34403c;
  --accent: #7fb3d1; --a: #7fb3d1; --b: #b4c46a; --u: #ef7a6c; --sel: #24384a; --edge: #50646c; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; padding: 16px 16px 40px }
h1 { font-size: 22px; margin: 0 }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between; margin-bottom: 12px }
.sub { color: var(--muted); max-width: 72ch }
.tabs { display: flex; flex-wrap: wrap; gap: 6px }
button { font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 4px; padding: 5px 10px; cursor: pointer }
button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent) }
button:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); gap: 16px; align-items: start }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0 }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line) }
.legend i { display: inline-block; width: 18px; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 4px }
.legend i.o { border-top: 2px dashed var(--edge) }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--a); margin-right: 4px }
.dot.b { background: var(--b) } .dot.u { background: var(--u) }
.wrap { overflow: auto; max-height: 76vh }
.chart { position: relative }
.chart svg { position: absolute; inset: 0; pointer-events: none }
.node { position: absolute; width: 168px; height: 52px; background: var(--bg); border: 1px solid var(--line); border-left: 4px solid var(--a); border-radius: 4px; padding: 6px 8px; cursor: pointer; overflow: hidden; text-align: left }
.node.b { border-left-color: var(--b) } .node.u { border-left-color: var(--u) }
.node.sel { background: var(--sel); border-color: var(--accent); border-left-width: 4px }
.node b, .end b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600 }
.node span, .end span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.end { position: absolute; width: 190px; height: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 3px 14px; font-size: 13px; line-height: 1.25; overflow: hidden }
.end.sel { border-color: var(--accent) }
.detail { padding: 4px 14px 14px }
.detail h3 { font-size: 19px; margin: 10px 0 2px }
.detail p { margin: 4px 0 }
.detail .q { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere }
.line { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 6px 0 }
.line small { color: var(--muted); display: block }
.out { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 8px 0; background: var(--bg) }
.out b { font-size: 15px }
.chip { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; margin: 2px 4px 0 0 }
.chip.up { border-color: var(--b); color: var(--b) } .chip.down { border-color: var(--u); color: var(--u) }
.muted { color: var(--muted) }
a.jump { color: var(--accent); cursor: pointer; text-decoration: underline }
</style>
<header>
  <div>
    <h1>Story Map</h1>
    <div class="sub">What is in the game now, read straight from <code>Story/Storylets</code>. Nothing here can be edited: pick a beat to read it, then say what should change.</div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="layout">
  <div class="panel">
    <div class="legend"><span><i></i>leads to</span><span><i class="o"></i>makes possible</span><span><span class="dot"></span>main plot</span><span><span class="dot b"></span>side plot</span><span><span class="dot u"></span>trouble (jumps the queue)</span></div>
    <div class="wrap"><div class="chart" id="chart"></div></div>
  </div>
  <div class="panel detail" id="detail"></div>
</div>
<script>
(() => {
"use strict";
const FILES = /*DATA*/[];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let file = 0, sel = null;
const D = () => FILES[file] ?? { storylets: [] };
const list = (x) => Array.isArray(x) ? x : x ? [x] : [];
const cls = (b) => b === "urgent" ? "u" : b === "B" ? "b" : "";
const plot = (b) => b === "urgent" ? "Trouble" : b === "B" ? "Side plot" : "Main plot";
const title = (id) => D().storylets.find((s) => s.id === id)?.title || id;
const cap = (t) => t ? t[0].toUpperCase() + t.slice(1) : "";

// "?me Rank +1" as words a reader wants; who a ?role is comes from the cast where it names someone.
function who(s, v) { if (v === "?me") return "the player"; const m = new RegExp("\\" + v + "\\s*==\\s*'([^']+)'").exec(s.cast ?? ""); return m ? m[1] : "the " + roleOf(s, v); }
function roleOf(s, v) { const m = new RegExp("\\" + v + "\\s+MemberOf\\s+'([^']+)'").exec(s.cast ?? ""); return m ? m[1] + " person cast (" + v + ")" : "person cast (" + v + ")"; }
function change(s, t) {
  const m = /^(\?\w+)\s+(\w+)\s*(?:('[^']*'|\?\w+)\s*)?([+\-=]\d+)?$/.exec(t.trim()); if (!m) return { text: t, dir: "" };
  const [, subj, what, obj, amt] = m; const n = amt ?? "";
  if (obj === "?me" && (what === "Likes" || what === "Grudge")) { const up = (what === "Likes") === !n.startsWith("-"); return { text: `${cap(who(s, subj))} thinks ${up ? "better" : "worse"} of the player (${n})`, dir: up ? "up" : "down" }; }
  if (obj) return { text: n === "=0" ? `No longer ${what}: ${obj.replace(/'/g, "")}` : `${what}: ${obj.replace(/'/g, "")}${n && n !== "=1" ? " " + n : ""}`, dir: "" };
  return { text: `${subj === "?me" ? "" : cap(who(s, subj)) + ": "}${what} ${n.startsWith("=") ? "set to " + n.slice(1) : n}`, dir: n.startsWith("-") ? "down" : n.startsWith("+") ? "up" : "" };
}
function trigger(e) {
  if (e.choice !== undefined) return `The player answers "${e.choice}"`;
  if (e.when) return `When ${e.when.verb}${e.when.item ? " (" + e.when.item + ")" : ""} happens${e.within ? ", within " + e.within : ""}`;
  return `After ${e.after ?? "a while"} with nothing else happening`;
}
function sets(e) { const w = []; for (const t of e.then ?? []) { const m = /^\?me\s+(\w+)\s*(?:'([^']*)')?\s*([+=]\d+)?$/.exec(t.trim()); if (m && m[3] !== "=0") w.push({ what: m[1], name: m[2] ?? null }); } if (e.learn) w.push({ what: "Lead", name: e.learn.replace(/'/g, "") }); return w; }
function needs(s) { const r = []; for (const n of list(s.needs)) for (const c of n.split(",")) { const m = /^\s*\?me\s+(\w+)\s*(?:'([^']*)')?/.exec(c); if (m && !/^\s*not\b/.test(c)) r.push({ what: m[1], name: m[2] ?? null }); } return r; }
const same = (a, b) => a.what === b.what && (a.name == null || b.name == null || a.name.toLowerCase() === b.name.toLowerCase());

function draw() {
  const S = D().storylets; const ids = new Set(S.map((s) => s.id));
  const L = [];
  for (const s of S) list(s.ends).forEach((e, i) => {
    if (e.next && ids.has(e.next)) L.push({ from: s.id, end: i, to: e.next, next: true });
    const w = sets(e);
    for (const t of S) if (t.id !== s.id && t.id !== e.next && needs(t).some((n) => w.some((x) => same(x, n)))) L.push({ from: s.id, end: i, to: t.id, next: false });
  });
  const depth = Object.fromEntries(S.map((s) => [s.id, 0])); const order = Object.fromEntries(S.map((s, i) => [s.id, i]));
  const led = new Set(L.filter((l) => l.next).map((l) => l.to));
  for (let pass = 0; pass < S.length; pass++) for (const l of L) {
    if (!l.next && (led.has(l.to) || order[l.from] > order[l.to])) continue;
    const d = depth[l.from] + 1; if (d > depth[l.to] && d < 12) depth[l.to] = d;
  }
  const cols = {}; for (const s of S) (cols[depth[s.id]] ??= []).push(s);
  const NW = 168, NH = 52, EW = 190, EH = 40, EG = 6, STUB = 22, CG = 64, PAD = 16, CW = NW + STUB + EW + CG;
  const pos = {}, epos = {}; let h = PAD * 2 + NH, maxCol = 0;
  for (const [c, col] of Object.entries(cols)) {
    let y = PAD; maxCol = Math.max(maxCol, +c);
    for (const s of col) {
      const n = list(s.ends).length, eh = n * (EH + EG) - EG, bh = Math.max(NH, eh), x = PAD + c * CW;
      pos[s.id] = { x, y: y + (bh - NH) / 2 };
      list(s.ends).forEach((e, i) => { epos[s.id + "/" + i] = { x: x + NW + STUB, y: y + (bh - eh) / 2 + i * (EH + EG) }; });
      y += bh + 26;
    }
    h = Math.max(h, y);
  }
  const w = PAD * 2 + (maxCol + 1) * CW - CG;
  const mark = (id, col) => `<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${col}"/></marker>`;
  let svg = `<svg width="${w}" height="${h}" aria-hidden="true"><defs>${mark("mo", "var(--edge)")}${mark("mn", "var(--accent)")}</defs>`;
  for (const s of S) list(s.ends).forEach((e, i) => {
    const a = pos[s.id], b = epos[s.id + "/" + i], y1 = a.y + NH / 2, y2 = b.y + EH / 2, mx = a.x + NW + STUB / 2;
    svg += `<path d="M${a.x + NW},${y1} H${mx} V${y2} H${b.x}" fill="none" stroke="var(--edge)" stroke-width="1.3"/>`;
  });
  for (const l of [...L.filter((x) => !x.next), ...L.filter((x) => x.next)]) {
    const b = epos[l.from + "/" + l.end], t = pos[l.to]; const x1 = b.x + EW, y1 = b.y + EH / 2, x2 = t.x, y2 = t.y + NH / 2;
    const back = x2 <= x1, cx = back ? x1 + 46 : x2 - CG / 2;
    const d = back ? `M${x1},${y1} C${cx},${y1} ${cx},${y2 + 70} ${(x1 + x2) / 2},${y2 + 70} S${x2 - 34},${y2} ${x2},${y2}` : `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
    svg += `<path d="${d}" fill="none" stroke="${l.next ? "var(--accent)" : "var(--edge)"}" stroke-width="${l.next ? 2 : 1.2}" ${l.next ? "" : 'stroke-dasharray="5 4" opacity=".6"'} marker-end="url(#${l.next ? "mn" : "mo"})"/>`;
  }
  let html = svg + "</svg>";
  for (const s of S) {
    const p = pos[s.id];
    html += `<button type="button" class="node ${cls(s.bucket)} ${s.id === sel ? "sel" : ""}" style="left:${p.x}px;top:${p.y}px" data-id="${esc(s.id)}"><b>${esc(s.title || s.id)}</b><span>${plot(s.bucket)}${s.again ? " · can repeat" : ""}${s.final ? " · end of a road" : ""}</span></button>`;
    list(s.ends).forEach((e, i) => {
      const q = epos[s.id + "/" + i]; const kind = e.choice !== undefined ? "the player chooses" : e.when ? "something happens" : "time runs out";
      html += `<div class="end ${s.id === sel ? "sel" : ""}" style="left:${q.x}px;top:${q.y}px" data-id="${esc(s.id)}"><b>${esc(e.choice ? `"${e.choice}"` : cap(e.id || "end"))}</b><span>${kind}${e.next ? " · to " + esc(title(e.next)) : ""}</span></div>`;
    });
  }
  const c = $("chart"); c.style.width = w + "px"; c.style.height = h + "px"; c.innerHTML = S.length ? html : `<p class="muted" style="padding:14px">No storylets in this file.</p>`;
}
function detail() {
  const s = D().storylets.find((x) => x.id === sel); const el = $("detail");
  if (!s) { el.innerHTML = `<p class="muted">Pick a beat on the chart.</p>`; return; }
  let h = `<h3>${esc(s.title || s.id)}</h3><p class="muted">${plot(s.bucket)}${s.again ? ", can come again after " + esc(s.again) : ", once per player"} · <span class="q">${esc(s.id)}</span> in ${esc(D().file)}</p>`;
  if (s.about) h += `<p>${esc(cap(s.about))}.</p>`;
  h += `<h2>Can happen when</h2>` + (list(s.needs).length ? list(s.needs).map((n, i) => `<p class="q">${i ? "or: " : ""}${esc(n.replace(/\?me/g, "player"))}</p>`).join("") : `<p class="muted">Any time.</p>`);
  if (s.cast) h += `<h2>Who plays it</h2><p class="q">${esc(s.cast)}</p>`;
  if (s.job) h += `<h2>Hands out the job</h2><p>${esc(s.job)}</p>`;
  if (list(s.beats).length) h += `<h2>What is said</h2>` + s.beats.map((b) => list(b.say).map((t) => `<div class="line"><small>${esc(cap(who(s, b.by ?? "?me")))}${b.after ? " · after " + esc(b.after) : ""}</small>${esc(t)}</div>`).join("")).join("");
  h += `<h2>How it can end</h2>`;
  for (const e of list(s.ends)) {
    const ch = (e.then ?? []).map((t) => change(s, t));
    if (e.learn) ch.push({ text: `The player learns of ${e.learn.replace(/'/g, "")}`, dir: "up" });
    if (e.hook ?? (list(s.ends).length === 1 ? s.hook : null)) ch.push({ text: `Starts: ${e.hook ?? s.hook}`, dir: "" });
    h += `<div class="out"><b>${esc(e.choice ? `"${e.choice}"` : cap(e.id || "end"))}</b><p>${esc(trigger(e))}${e.if ? `, only if <span class="q">${esc(e.if.replace(/\?me/g, "player"))}</span>` : ""}.</p>
      ${ch.map((c) => `<span class="chip ${c.dir}">${esc(c.text)}</span>`).join("") || `<span class="muted">Changes nothing.</span>`}
      ${list(e.say).map((t) => `<div class="line"><small>Then said</small>${esc(t)}</div>`).join("")}
      ${e.next ? `<p>Leads to <a class="jump" data-id="${esc(e.next)}">${esc(title(e.next))}</a>.</p>` : ""}</div>`;
  }
  if (!list(s.ends).length) h += `<p class="muted">It has no ends.</p>`;
  el.innerHTML = h;
}
function pick(id) { sel = id; draw(); detail(); }
function tabs() { $("tabs").innerHTML = FILES.map((f, i) => `<button type="button" data-f="${i}" aria-pressed="${i === file}" title="${esc(f.about ?? "")}">${esc(f.file.replace(/\.json$/, ""))} (${(f.storylets ?? []).length})</button>`).join(""); }
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; file = +b.dataset.f; tabs(); pick(D().storylets[0]?.id ?? null); });
$("chart").addEventListener("click", (e) => { const n = e.target.closest("[data-id]"); if (n) pick(n.dataset.id); });
$("detail").addEventListener("click", (e) => { const a = e.target.closest(".jump"); if (a) pick(a.dataset.id); });
tabs(); pick(D().storylets[0]?.id ?? null);
})();
</script>
