# TEMP (fix/test-focus): run every self-test section on its own, to find sections that need an earlier one.
name: TEMP section isolation

on:
  push:
    branches: [fix/test-focus]

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        run: dotnet build CallOfSlop.csproj -c Release -nologo
      - name: Each section alone
        shell: bash
        run: |
          set +e
          dir=bin/Release/net10.0
          dotnet "$dir/CallOfSlop.dll" --selftest-list > all.txt
          printf '%s\n' "Scene graph" "Gun samples" "Bots" > names.txt
          dotnet "$dir/CallOfSlop.dll" --selftest-only "frenzy" < /dev/null; echo "::notice title=Prefix frenzy::exit $?; $(grep -m1 '^FILTERED' "$dir/selftest.log")"
          dotnet "$dir/CallOfSlop.dll" --selftest-only < /dev/null; echo "::notice title=No names::exit $?; $(grep -m1 'FAIL' "$dir/selftest.log" | cut -c1-120)"
          echo "::notice title=List::$(wc -l < all.txt) sections; first: $(head -1 all.txt); last: $(tail -1 all.txt)"
          bad=""; times=""
          dotnet "$dir/CallOfSlop.dll" --selftest-only "Nope section" ; c=$?
          echo "::notice title=Unknown name::exit $c; $(grep -m1 FAIL "$dir/selftest.log" | cut -c1-300)"
          while IFS= read -r n; do
            s=$(date +%s)
            timeout 400 dotnet "$dir/CallOfSlop.dll" --selftest-only "$n" < /dev/null > /dev/null 2>&1; c=$?
            e=$(( $(date +%s) - s ))
            times="$times; $n ${e}s"
            if [ "$c" -ne 0 ]; then
              f=$(grep -m2 "FAIL:" "$dir/selftest.log" | cut -c1-160 | tr '\n' ' ')
              bad="$bad%0A$n (exit $c): $f"
            fi
          done < names.txt
          echo "::notice title=Alone times::${times:2}"
          if [ -n "$bad" ]; then echo "::error title=Fail alone::${bad:3}"; else echo "::notice title=Fail alone::none"; fi
