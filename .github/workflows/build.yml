# Builds the game and runs the headless self-test on every push and pull request.
# The self-test (CallOfSlop.exe --selftest) checks maps, map files, movement, perks, melee,
# attachments, packets, full bot matches, the map vote and the server browser. See Source/App/SelfTest.cs.
name: Build and self-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build CallOfSlop.csproj -c Release -nologo

      - name: Hashes
        shell: pwsh
        run: |
          $dir = "bin/Release/net10.0"
          $all = ""
          foreach ($f in Get-ChildItem -Recurse "$dir/Maps" -Filter *.json | Where-Object { $_.Name -ne 'pack.json' }) {
            $p = Start-Process -FilePath "$dir/CallOfSlop.exe" -ArgumentList "--check-map", "`"$($f.FullName)`"" -Wait -PassThru -NoNewWindow
            $line = Select-String -Path "$dir/callofslop.log" -Pattern "fingerprint ([0-9a-f]+)" | Select-Object -First 1
            if ($line) { $all += "$($f.BaseName)=$($line.Matches[0].Groups[1].Value);" } else { $all += "$($f.BaseName)=ERR;" }
          }
          Write-Output "::notice title=hashes::$all"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selftest-logs
          path: |
            bin/Release/net10.0/selftest.log
            bin/Release/net10.0/callofslop.log
          if-no-files-found: ignore
