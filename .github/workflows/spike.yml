# Jolt / scene-graph / glTF spike: builds spike/JoltSpike and runs each section on two Windows images and
# Linux, then compares the determinism hashes across machines. Only runs on spike branches (or by hand);
# it never touches the game build. Results are printed as annotations (see docs/design/jolt-scene-mesh.md).
name: Jolt spike

on:
  push:
    branches: [ 'spike/**' ]
  workflow_dispatch:

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-2022, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          mkdir -p spike/out
          dotnet build spike/JoltSpike/JoltSpike.csproj -c Release -nologo

      - name: Package versions on nuget.org
        if: runner.os == 'Linux'
        run: |
          for p in ahwoo.brutal.jolt ahwoo.brutal.gltf ahwoo.brutal.render.mesh; do
            v=$(curl -s https://api.nuget.org/v3-flatcontainer/$p/index.json | tr -d '\n ' | grep -o '"versions":\[[^]]*\]' | tail -c 300)
            echo "::notice title=nuget $p::$v"
          done

      - name: Jolt binding vs native exports
        if: runner.os == 'Linux'
        run: |
          pkg=$(ls -d ~/.nuget/packages/ahwoo.brutal.jolt/*/ | tail -1)
          so=$(find "$pkg" -name '*.so' | head -1)
          win=$(find "$pkg" -iname '*jolt*.dll' -path '*win*' | head -1)
          dll=$(find "$pkg" -name 'Brutal.Jolt.dll' | head -1)
          echo "::notice title=package files::$(cd $pkg && find . -type f | grep -v -E '\.xml$' | tr '\n' ' ')"
          nm -D --defined-only "$so" | awk '{print $3}' | sort -u > native.txt
          strings -a "$dll" | grep -E '^[A-Z][A-Za-z0-9]+_[A-Za-z0-9_]+$' | sort -u > managed.txt
          comm -23 managed.txt native.txt > missing.txt
          echo "::notice title=binding totals::managed entry points $(wc -l < managed.txt), native exports $(wc -l < native.txt), managed-but-not-native $(wc -l < missing.txt)"
          # Every query-shaped entry point: is it in the managed binding (M), the Linux .so (L), the Windows .dll (W)?
          if [ -n "$win" ]; then objdump -p "$win" | awk '/\[Ordinal\/Name Pointer\] Table/{f=1;next} f&&/\]/{print $NF}' | sort -u > nativewin.txt; else : > nativewin.txt; fi
          echo "::notice title=windows dll::$win exports $(wc -l < nativewin.txt)"
          cat managed.txt native.txt nativewin.txt | grep -v '^_Z' | grep -E 'CastRay|CollidePoint|CastShape|CollideShape|CollisionDispatch|RayCast|TransformedShape_|BodyLockInterface|GetNarrowPhaseQuery|GetBroadPhaseQuery|HeightFieldShapeSettings_|MeshShapeSettings_|ConvexHullShapeSettings_|IndexedTriangle_|CharacterVirtual_(Save|Restore|Check)' | sort -u > q.txt
          out=""
          while read -r n; do
            m=$(grep -qx "$n" managed.txt && echo M || echo -); l=$(grep -qx "$n" native.txt && echo L || echo -); w=$(grep -qx "$n" nativewin.txt && echo W || echo -)
            out="$out $n:$m$l$w"
          done < q.txt
          i=0; while [ -n "$out" ] && [ $i -lt 6 ]; do i=$((i+1)); echo "::notice title=query exports $i (M=managed L=linux W=windows)::${out:0:3900}"; out="${out:3900}"; done
          cp native.txt nativewin.txt managed.txt missing.txt q.txt spike/out/ || true

      - name: Machine
        run: |
          cpu=$( (lscpu 2>/dev/null | grep 'Model name' | sed 's/.*: *//') || true)
          [ -z "$cpu" ] && cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" 2>/dev/null)
          echo "::notice title=machine ${{ matrix.os }}::$cpu, $(nproc 2>/dev/null || echo $NUMBER_OF_PROCESSORS) cpus"

      - name: a - basic world and ray casts
        continue-on-error: true
        working-directory: spike/out
        run: dotnet ../.build/bin/Release/net10.0/JoltSpike.dll a

      - name: b - CharacterVirtual movement
        continue-on-error: true
        working-directory: spike/out
        run: dotnet ../.build/bin/Release/net10.0/JoltSpike.dll b

      - name: c - determinism and reconciliation
        continue-on-error: true
        working-directory: spike/out
        run: dotnet ../.build/bin/Release/net10.0/JoltSpike.dll c

      - name: d - ray and build performance
        continue-on-error: true
        working-directory: spike/out
        run: dotnet ../.build/bin/Release/net10.0/JoltSpike.dll d

      - name: e - lag compensation
        continue-on-error: true
        working-directory: spike/out
        run: dotnet ../.build/bin/Release/net10.0/JoltSpike.dll e

      - name: f - glTF and scene graph
        continue-on-error: true
        working-directory: spike/out
        run: dotnet ../.build/bin/Release/net10.0/JoltSpike.dll f

      - name: Collect
        if: always()
        working-directory: spike/out
        run: |
          cat results-*.txt > results-${{ matrix.os }}.txt 2>/dev/null || true
          echo "::notice title=hashes ${{ matrix.os }}::$(grep '^c\.' results-${{ matrix.os }}.txt | tr '\n' ' ')"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: spike-${{ matrix.os }}
          path: spike/out/
          if-no-files-found: ignore

  compare:
    needs: spike
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: spike-*
          path: all
      - name: Compare determinism across machines
        shell: bash
        run: |
          ref=all/spike-windows-latest/results-windows-latest.txt
          for other in windows-2022 ubuntu-latest; do
            f=all/spike-$other/results-$other.txt
            if [ ! -f "$ref" ] || [ ! -f "$f" ]; then echo "::error title=compare $other::missing results"; continue; fi
            same=0; diff=0; detail=""
            while IFS='=' read -r k v; do
              case "$k" in c.*) ;; *) continue ;; esac
              v=${v%$'\r'}
              o=$(grep "^$k=" "$f" | head -1 | cut -d= -f2- | tr -d '\r' || true)
              if [ "$v" = "$o" ]; then same=$((same+1)); else diff=$((diff+1)); detail="$detail $k: windows-latest=$v $other=$o;"; fi
            done < "$ref"
            if [ $diff -eq 0 ]; then
              echo "::notice title=determinism windows-latest vs $other::IDENTICAL ($same keys)"
            else
              echo "::warning title=determinism windows-latest vs $other::$diff of $((same+diff)) differ:$detail"
            fi
          done
          cfgw=$(grep '^a.config=' $ref | cut -d= -f2- || true); cfgl=$(grep '^a.config=' all/spike-ubuntu-latest/results-ubuntu-latest.txt 2>/dev/null | cut -d= -f2- || true)
          echo "::notice title=jolt build config::windows: $cfgw | linux: $cfgl"
          exit 0
